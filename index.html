<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML수업 2</title>
</head>
<body>  
    <!-- <i>태그 기울기 태그 , 아이콘 -->
    <!-- <em>태그 기울기,강조 태그 -->
    <!-- <u>태그 밑줄 태그 -->
    <!-- <s>태그 취소선 태그 -->
    <!-- <mark>태그 형광팬 처럼 사용하는 태그 -->
    <p>
    <span>Lorem</span><strong> ipsum </strong>dolor, <b>sit</b> amet <mark>consectetur adipisicing</mark>  elit. <br> Dicta omnis ullam saepe. <br><br><br>
    <s>iVoluptatem </s><u>aliquid</u> commodi, dicta quis quaerat sit corrupti omnis natus, iusto dolores nam praesentium <i>김원년</i>enim nesciunt <em>김원년</em> obcaecati culpa!</p>
    <!-- hr태그는 가로줄 태그이다 -->
    <hr>
    <!-- p*3 -->
    <!--&nbsp; : 공백 태그 -->
    <!-- <abbr>태그 머릿글 표현하는 태그 -->
    <abbr title="열심히 공부중">HTML태그 공부중</abbr>
    <p>김원년 &nbsp; &nbsp; 안녕하세요</p>
    <p></p>
    <p></p>
    <span></span><span></span><span></span>
    <!-- (src="" alt=""): img의 속성 -->
    <img src="" alt="">
</body> <!--body 끝-->
</html>
